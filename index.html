<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Lab - Professional Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameCanvas {
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            cursor: default;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <!-- Background stars -->
    <div class="stars" id="stars"></div>

    <!-- Main game canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== GLOBAL SETUP ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Fixed canvas size for consistent layout
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 700;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Scene state machine
        let currentScene = 'hub'; // 'hub', 'game1', 'game2', 'game3', 'game4', 'game5'

        // Mouse state
        let mouseX = 0;
        let mouseY = 0;
        let mousePressed = false;
        let pmouseX = 0;
        let pmouseY = 0;

        // ==================== UTILITY FUNCTIONS ====================

        // Distance between two points
        function dist(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Check if point is in circle
        function pointInCircle(px, py, cx, cy, radius) {
            return dist(px, py, cx, cy) <= radius;
        }

        // Check if point is in rectangle
        function pointInRect(px, py, rx, ry, rw, rh) {
            return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
        }

        // Draw rounded rectangle path
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // Easing function
        function easeOutQuad(t) {
            return t * (2 - t);
        }

        // Linear interpolation
        function lerp(start, end, t) {
            return start + (end - start) * t;
        }

        // ==================== BACKGROUND STARS ====================
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // ==================== HUB SCENE ====================

        const hub = {
            // Platform
            platform: {
                x: CANVAS_WIDTH / 2,
                y: CANVAS_HEIGHT / 2 + 20,
                width: 900,
                height: 500,
                radius: 20
            },

            // Icons arranged in a perfect circle
            icons: [],

            // Status text at bottom
            statusText: 'Hover over the icons to learn how to unlock each game',

            // Help button
            helpButton: {
                x: CANVAS_WIDTH - 70,
                y: 30,
                radius: 20,
                hover: false
            },

            // Individual game states
            game1: {
                energy: 0,
                unlocked: false,
                hover: false,
                scale: 1
            },

            game2: {
                unlocked: false,
                sliced: false,
                sliceAnim: 0,
                hover: false,
                scale: 1,
                knife: {
                    x: 0,
                    y: 0,
                    dragging: false,
                    homeX: 0,
                    homeY: 0
                }
            },

            game3: {
                sliderPos: 0,
                unlocked: false,
                doorAnim: 0,
                hover: false,
                scale: 1,
                sliderDragging: false
            },

            game4: {
                unlocked: false,
                inputText: '',
                inputActive: false,
                pageFlip: 0,
                hover: false,
                scale: 1,
                shake: 0
            },

            game5: {
                angle: 0,
                progress: 0,
                unlocked: false,
                dragging: false,
                hover: false,
                scale: 1,
                lastAngle: 0
            }
        };

        // Initialize hub icons with precise circular layout
        function initHub() {
            const centerX = CANVAS_WIDTH / 2;
            const centerY = CANVAS_HEIGHT / 2 + 20;
            const radius = 180;
            const iconRadius = 55;

            // 5 icons arranged in a circle, starting from top
            const angles = [
                -Math.PI / 2,           // Top
                -Math.PI / 2 + Math.PI * 2 / 5,
                -Math.PI / 2 + Math.PI * 4 / 5,
                -Math.PI / 2 + Math.PI * 6 / 5,
                -Math.PI / 2 + Math.PI * 8 / 5
            ];

            hub.icons = [
                {
                    id: 'game1',
                    x: centerX + Math.cos(angles[0]) * radius,
                    y: centerY + Math.sin(angles[0]) * radius,
                    radius: iconRadius,
                    color: '#fbbf24',
                    label: 'Lightning Reaction',
                    hint: 'Hover to charge the orb to 100%'
                },
                {
                    id: 'game2',
                    x: centerX + Math.cos(angles[1]) * radius,
                    y: centerY + Math.sin(angles[1]) * radius,
                    radius: iconRadius,
                    color: '#ef4444',
                    label: 'Fruit Slice',
                    hint: 'Drag the knife to slice the fruit'
                },
                {
                    id: 'game3',
                    x: centerX + Math.cos(angles[2]) * radius,
                    y: centerY + Math.sin(angles[2]) * radius,
                    radius: iconRadius,
                    color: '#6366f1',
                    label: 'Maze Runner',
                    hint: 'Slide the handle all the way to the right'
                },
                {
                    id: 'game4',
                    x: centerX + Math.cos(angles[3]) * radius,
                    y: centerY + Math.sin(angles[3]) * radius,
                    radius: iconRadius,
                    color: '#a855f7',
                    label: 'Memory Match',
                    hint: 'Type the magic word: MEMORY'
                },
                {
                    id: 'game5',
                    x: centerX + Math.cos(angles[4]) * radius,
                    y: centerY + Math.sin(angles[4]) * radius,
                    radius: iconRadius,
                    color: '#3b82f6',
                    label: 'Space Dodge',
                    hint: 'Drag the planet in a full circle (360°)'
                }
            ];

            // Initialize knife position for game2
            const icon2 = hub.icons[1];
            hub.game2.knife.x = icon2.x + 80;
            hub.game2.knife.y = icon2.y;
            hub.game2.knife.homeX = icon2.x + 80;
            hub.game2.knife.homeY = icon2.y;
        }
        initHub();

        // Update hub logic
        function updateHub() {
            const icon1 = hub.icons[0];
            const icon2 = hub.icons[1];
            const icon3 = hub.icons[2];
            const icon4 = hub.icons[3];
            const icon5 = hub.icons[4];

            // Reset hover states
            hub.game1.hover = false;
            hub.game2.hover = false;
            hub.game3.hover = false;
            hub.game4.hover = false;
            hub.game5.hover = false;
            hub.helpButton.hover = false;

            // Game 1: Lightning - Charge on hover
            if (!hub.game1.unlocked) {
                if (pointInCircle(mouseX, mouseY, icon1.x, icon1.y, icon1.radius)) {
                    hub.game1.energy = Math.min(100, hub.game1.energy + 1.5);
                    hub.game1.hover = true;
                    hub.statusText = `Charging... ${Math.floor(hub.game1.energy)}%`;
                } else {
                    hub.game1.energy = Math.max(0, hub.game1.energy - 0.8);
                }

                if (hub.game1.energy >= 100) {
                    hub.game1.unlocked = true;
                    hub.statusText = 'Lightning Reaction Test unlocked! Click to play.';
                }
            } else if (pointInCircle(mouseX, mouseY, icon1.x, icon1.y, icon1.radius)) {
                hub.game1.hover = true;
                hub.statusText = 'Click to start Lightning Reaction Test';
            }

            // Game 2: Fruit - Check knife dragging
            if (!hub.game2.sliced) {
                const knifeHit = pointInCircle(mouseX, mouseY, hub.game2.knife.x, hub.game2.knife.y, 25);
                if (knifeHit || hub.game2.knife.dragging) {
                    canvas.style.cursor = 'grab';
                }

                if (hub.game2.knife.dragging) {
                    hub.game2.knife.x = mouseX;
                    hub.game2.knife.y = mouseY;
                    canvas.style.cursor = 'grabbing';

                    // Check if knife is over fruit
                    if (pointInCircle(hub.game2.knife.x, hub.game2.knife.y, icon2.x, icon2.y, icon2.radius + 20)) {
                        hub.statusText = 'Release to slice the fruit!';
                    }
                }
            } else {
                // Animate slice
                if (hub.game2.sliceAnim < 1) {
                    hub.game2.sliceAnim += 0.02;
                }
                if (hub.game2.sliceAnim >= 1 && !hub.game2.unlocked) {
                    hub.game2.unlocked = true;
                    hub.statusText = 'Fruit Slice unlocked! Click to play.';
                }
            }

            if (hub.game2.unlocked && pointInCircle(mouseX, mouseY, icon2.x, icon2.y, icon2.radius)) {
                hub.game2.hover = true;
                hub.statusText = 'Click to start Fruit Slice';
            }

            // Game 3: Door - Slider
            if (!hub.game3.unlocked) {
                const sliderX = icon3.x - 60 + hub.game3.sliderPos * 120;
                const sliderY = icon3.y - 80;

                if (pointInCircle(mouseX, mouseY, sliderX, sliderY, 15) || hub.game3.sliderDragging) {
                    hub.game3.hover = true;
                    canvas.style.cursor = 'grab';
                }

                if (hub.game3.sliderDragging) {
                    canvas.style.cursor = 'grabbing';
                    const localX = mouseX - (icon3.x - 60);
                    hub.game3.sliderPos = Math.max(0, Math.min(1, localX / 120));
                    hub.statusText = `Slide to unlock... ${Math.floor(hub.game3.sliderPos * 100)}%`;
                }

                if (hub.game3.sliderPos >= 0.99) {
                    if (hub.game3.doorAnim < 1) {
                        hub.game3.doorAnim += 0.02;
                    } else {
                        hub.game3.unlocked = true;
                        hub.statusText = 'Maze Runner unlocked! Click to play.';
                    }
                }
            } else if (pointInCircle(mouseX, mouseY, icon3.x, icon3.y, icon3.radius)) {
                hub.game3.hover = true;
                hub.statusText = 'Click to start Maze Runner';
            }

            // Game 4: Book - Input
            if (hub.game4.shake > 0) {
                hub.game4.shake -= 1;
            }

            if (hub.game4.unlocked && pointInCircle(mouseX, mouseY, icon4.x, icon4.y, icon4.radius)) {
                hub.game4.hover = true;
                hub.statusText = 'Click to start Memory Match';
            }

            // Game 5: Planet - Rotation
            if (hub.game5.dragging) {
                const dx = mouseX - icon5.x;
                const dy = mouseY - icon5.y;
                const currentAngle = Math.atan2(dy, dx);

                let angleDiff = currentAngle - hub.game5.lastAngle;
                if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                hub.game5.progress += Math.abs(angleDiff) / (Math.PI * 2);
                hub.game5.lastAngle = currentAngle;

                hub.statusText = `Rotate the planet... ${Math.floor(hub.game5.progress * 100)}%`;

                if (hub.game5.progress >= 1) {
                    hub.game5.unlocked = true;
                    hub.game5.dragging = false;
                    hub.statusText = 'Space Dodge unlocked! Click to play.';
                }
            } else if (!hub.game5.unlocked && pointInCircle(mouseX, mouseY, icon5.x, icon5.y, icon5.radius)) {
                hub.game5.hover = true;
                canvas.style.cursor = 'grab';
            }

            if (hub.game5.unlocked && pointInCircle(mouseX, mouseY, icon5.x, icon5.y, icon5.radius)) {
                hub.game5.hover = true;
                hub.statusText = 'Click to start Space Dodge';
            }

            // Update scales for hover effects
            hub.game1.scale = lerp(hub.game1.scale, hub.game1.hover ? 1.1 : 1, 0.2);
            hub.game2.scale = lerp(hub.game2.scale, hub.game2.hover ? 1.1 : 1, 0.2);
            hub.game3.scale = lerp(hub.game3.scale, hub.game3.hover ? 1.1 : 1, 0.2);
            hub.game4.scale = lerp(hub.game4.scale, hub.game4.hover ? 1.1 : 1, 0.2);
            hub.game5.scale = lerp(hub.game5.scale, hub.game5.hover ? 1.1 : 1, 0.2);

            // Help button
            if (pointInCircle(mouseX, mouseY, hub.helpButton.x, hub.helpButton.y, hub.helpButton.radius)) {
                hub.helpButton.hover = true;
                canvas.style.cursor = 'pointer';
            }

            // Reset cursor if nothing is hoverable
            if (!hub.game1.hover && !hub.game2.hover && !hub.game3.hover &&
                !hub.game4.hover && !hub.game5.hover && !hub.helpButton.hover &&
                !hub.game2.knife.dragging && !hub.game3.sliderDragging && !hub.game5.dragging) {
                canvas.style.cursor = 'default';
            }
        }

        // Draw hub
        function drawHub() {
            // Clear background
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw central platform
            const p = hub.platform;
            ctx.save();
            ctx.shadowColor = 'rgba(99, 102, 241, 0.3)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = 'rgba(30, 30, 60, 0.6)';
            roundRect(p.x - p.width / 2, p.y - p.height / 2, p.width, p.height, p.radius);
            ctx.fill();
            ctx.restore();

            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Mini Game Lab', CANVAS_WIDTH / 2, 60);

            // Subtitle
            ctx.font = '18px "Segoe UI"';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillText('Unlock and play 5 unique mini games', CANVAS_WIDTH / 2, 95);

            // Help button
            drawHelpButton();

            // Draw each game icon
            drawGame1Icon();
            drawGame2Icon();
            drawGame3Icon();
            drawGame4Icon();
            drawGame5Icon();

            // Status text at bottom
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            roundRect(100, CANVAS_HEIGHT - 70, CANVAS_WIDTH - 200, 50, 25);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = '16px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(hub.statusText, CANVAS_WIDTH / 2, CANVAS_HEIGHT - 45);
        }

        function drawHelpButton() {
            const btn = hub.helpButton;
            const scale = btn.hover ? 1.1 : 1;

            ctx.save();
            ctx.translate(btn.x, btn.y);
            ctx.scale(scale, scale);

            // Circle
            ctx.fillStyle = btn.hover ? '#6366f1' : 'rgba(99, 102, 241, 0.6)';
            ctx.beginPath();
            ctx.arc(0, 0, btn.radius, 0, Math.PI * 2);
            ctx.fill();

            // Question mark
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', 0, 0);

            ctx.restore();
        }

        // Game 1 Icon: Lightning
        function drawGame1Icon() {
            const icon = hub.icons[0];
            const scale = hub.game1.scale;

            ctx.save();
            ctx.translate(icon.x, icon.y);
            ctx.scale(scale, scale);

            // Glow effect
            if (hub.game1.hover || hub.game1.unlocked) {
                ctx.shadowColor = icon.color;
                ctx.shadowBlur = 30;
            }

            // Circle
            ctx.fillStyle = hub.game1.unlocked ? '#10b981' : icon.color;
            ctx.beginPath();
            ctx.arc(0, 0, icon.radius, 0, Math.PI * 2);
            ctx.fill();

            // Lightning symbol
            ctx.fillStyle = '#1a1a2e';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚡', 0, 0);

            ctx.restore();

            // Label
            ctx.fillStyle = icon.color;
            ctx.font = 'bold 14px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(icon.label, icon.x, icon.y - icon.radius - 15);

            // Progress bar (if not unlocked)
            if (!hub.game1.unlocked) {
                const barWidth = 100;
                const barHeight = 12;
                const barX = icon.x - barWidth / 2;
                const barY = icon.y + icon.radius + 20;

                // Background
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                roundRect(barX, barY, barWidth, barHeight, 6);
                ctx.fill();

                // Progress
                ctx.fillStyle = icon.color;
                const progress = (barWidth - 4) * (hub.game1.energy / 100);
                roundRect(barX + 2, barY + 2, progress, barHeight - 4, 4);
                ctx.fill();
            } else {
                // "Click to Start" text
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 12px "Segoe UI"';
                ctx.fillText('Click to Start', icon.x, icon.y + icon.radius + 25);
            }
        }

        // Game 2 Icon: Fruit + Knife
        function drawGame2Icon() {
            const icon = hub.icons[1];
            const scale = hub.game2.scale;

            ctx.save();
            ctx.translate(icon.x, icon.y);
            ctx.scale(scale, scale);

            if (hub.game2.hover) {
                ctx.shadowColor = icon.color;
                ctx.shadowBlur = 30;
            }

            if (!hub.game2.sliced) {
                // Whole fruit
                ctx.fillStyle = icon.color;
                ctx.beginPath();
                ctx.arc(0, 0, icon.radius, 0, Math.PI * 2);
                ctx.fill();

                // Stripes
                ctx.strokeStyle = '#7f1d1d';
                ctx.lineWidth = 3;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-icon.radius + i * 15, -icon.radius);
                    ctx.lineTo(-icon.radius + i * 15, icon.radius);
                    ctx.stroke();
                }
            } else {
                // Sliced fruit (two halves)
                const offset = hub.game2.sliceAnim * 30;

                ctx.save();
                ctx.translate(-offset, -offset);
                ctx.fillStyle = icon.color;
                ctx.beginPath();
                ctx.arc(0, 0, icon.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.translate(offset, offset);
                ctx.fillStyle = icon.color;
                ctx.beginPath();
                ctx.arc(0, 0, icon.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();

            // Label
            ctx.fillStyle = icon.color;
            ctx.font = 'bold 14px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(icon.label, icon.x, icon.y - icon.radius - 15);

            // Knife
            if (!hub.game2.sliced) {
                drawKnife(hub.game2.knife.x, hub.game2.knife.y, hub.game2.knife.dragging);
            }

            if (hub.game2.unlocked) {
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 12px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('Click to Start', icon.x, icon.y + icon.radius + 25);
            }
        }

        function drawKnife(x, y, dragging) {
            ctx.save();
            ctx.translate(x, y);
            if (dragging) {
                ctx.rotate(Math.PI / 4);
                ctx.scale(1.1, 1.1);
            }

            // Handle
            ctx.fillStyle = '#92400e';
            roundRect(-8, 15, 16, 25, 4);
            ctx.fill();

            // Blade
            ctx.fillStyle = '#d1d5db';
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(-12, 15);
            ctx.lineTo(12, 15);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        // Game 3 Icon: Door + Slider
        function drawGame3Icon() {
            const icon = hub.icons[2];
            const scale = hub.game3.scale;

            ctx.save();
            ctx.translate(icon.x, icon.y);
            ctx.scale(scale, scale);

            if (hub.game3.hover) {
                ctx.shadowColor = icon.color;
                ctx.shadowBlur = 30;
            }

            // Door frame
            const doorW = 70;
            const doorH = 100;

            ctx.strokeStyle = icon.color;
            ctx.lineWidth = 4;
            ctx.strokeRect(-doorW / 2, -doorH / 2, doorW, doorH);

            // Door panels
            if (hub.game3.doorAnim === 0) {
                ctx.fillStyle = '#4338ca';
                ctx.fillRect(-doorW / 2 + 2, -doorH / 2 + 2, doorW - 4, doorH - 4);

                // Center line
                ctx.strokeStyle = '#312e81';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -doorH / 2);
                ctx.lineTo(0, doorH / 2);
                ctx.stroke();
            } else {
                // Opening animation
                const offset = easeOutQuad(hub.game3.doorAnim) * (doorW / 2 + 5);

                ctx.fillStyle = '#4338ca';
                ctx.fillRect(-doorW / 2 + 2 - offset, -doorH / 2 + 2, doorW / 2 - 2, doorH - 4);
                ctx.fillRect(offset, -doorH / 2 + 2, doorW / 2 - 2, doorH - 4);

                // Glow from inside
                ctx.fillStyle = `rgba(251, 191, 36, ${hub.game3.doorAnim * 0.4})`;
                ctx.fillRect(-doorW / 2, -doorH / 2, doorW, doorH);
            }

            ctx.restore();

            // Label
            ctx.fillStyle = icon.color;
            ctx.font = 'bold 14px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(icon.label, icon.x, icon.y - icon.radius - 15);

            // Slider track
            const trackY = icon.y - 80;
            const trackX = icon.x - 60;
            const trackW = 120;

            ctx.strokeStyle = icon.color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(trackX, trackY);
            ctx.lineTo(trackX + trackW, trackY);
            ctx.stroke();

            // Slider handle
            const handleX = trackX + hub.game3.sliderPos * trackW;
            ctx.fillStyle = hub.game3.sliderDragging ? '#fbbf24' : '#8b5cf6';
            ctx.beginPath();
            ctx.arc(handleX, trackY, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (hub.game3.unlocked) {
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 12px "Segoe UI"';
                ctx.textAlign = 'center';

        // ==================== GAME 2: FRUIT SLICE ====================

        const game2 = {

        function initGame2() {
            game2.fruits = [];
            game2.bombs = [];
            game2.slicePath = [];
            game2.score = 0;
            game2.timeLeft = 60;
            game2.gameOver = false;
            game2.won = false;

            const timer = setInterval(() => {
                if (currentScene !== 'game2' || game2.gameOver) {

                if (currentScene !== 'game2' || game2.gameOver) {
                    clearInterval(game2.spawnInterval);
                    return;
                }
                spawnFruit2();

                // Increase difficulty
                if (game2.spawnRate > game2.minSpawnRate) {
                    game2.spawnRate -= 5;
                    clearInterval(game2.spawnInterval);
                    game2.spawnInterval = setInterval(() => {
                        if (currentScene === 'game2' && !game2.gameOver) {
                            spawnFruit2();
                        }
                    }, game2.spawnRate);
                }
            }, game2.spawnRate);
        }

        function spawnFruit2() {
            const isBomb = Math.random() < 0.2;
            const obj = {
                x: Math.random() * (CANVAS_WIDTH - 100) + 50,
                y: CANVAS_HEIGHT + 30,
                vx: (Math.random() - 0.5) * 5,
                vy: -(Math.random() * 10 + 15),
                radius: 25,
                color: isBomb ? '#1f2937' : ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'][Math.floor(Math.random() * 5)],
                isBomb: isBomb,
                sliced: false,
                rotation: Math.random() * Math.PI * 2
            };

            if (isBomb) {
                game2.bombs.push(obj);
            } else {
                game2.fruits.push(obj);
            }
        }

        function updateGame2() {
            if (game2.gameOver) return;

            // Update fruits
            [...game2.fruits, ...game2.bombs].forEach(obj => {
                obj.vy += 0.6;
                obj.x += obj.vx;
                obj.y += obj.vy;
                obj.rotation += 0.05;

                // Check slice
                if (!obj.sliced && game2.slicePath.length > 3) {
                    for (let point of game2.slicePath) {
                        if (dist(point.x, point.y, obj.x, obj.y) < obj.radius) {
                            obj.sliced = true;
                            if (obj.isBomb) {
                                game2.gameOver = true;
                            } else {
                                game2.score++;
                                createParticles2(obj.x, obj.y, obj.color);
                                if (game2.score >= game2.targetScore) {
                                    game2.won = true;
                                    game2.gameOver = true;
                                }
                            }
                            break;
                        }
                    }
                }
            });

            game2.fruits = game2.fruits.filter(f => f.y < CANVAS_HEIGHT + 100 && !f.sliced);
            game2.bombs = game2.bombs.filter(b => b.y < CANVAS_HEIGHT + 100 && !b.sliced);

            // Update particles
            game2.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life--;
            });
            game2.particles = game2.particles.filter(p => p.life > 0);

            // Decay slice path
            if (game2.slicePath.length > 0) {
                game2.slicePath.shift();
            }
        }

        function createParticles2(x, y, color) {
            for (let i = 0; i < 12; i++) {
                game2.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 30,
                    color
                });
            }
        }

            ctx.fillText(`Score: ${game2.score} / ${game2.targetScore}`, CANVAS_WIDTH / 2 - 100, 110);
            ctx.fillText(`Time: ${game2.timeLeft}s`, CANVAS_WIDTH / 2 + 100, 110);

            // Draw fruits and bombs
            [...game2.fruits, ...game2.bombs].forEach(obj => {
                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.rotation);

                ctx.fillStyle = obj.color;
                ctx.beginPath();
                ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
                ctx.fill();

                if (obj.isBomb) {
                    ctx.fillStyle = '#dc2626';

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💣', 0, 0);
                }

                ctx.restore();

            // Slice trail
            if (game2.slicePath.length > 1) {
                ctx.strokeStyle = '#ffffff';

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#ffffff';

                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Particles
            game2.particles.forEach(p => {
                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);

                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (game2.won) {
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 56px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('Victory!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 40);
                } else {
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 56px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('Game Over!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 40);
                }

                ctx.font = 'bold 32px "Segoe UI"';
                ctx.fillText(`Final Score: ${game2.score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);

        function initGame3() {
            game3.player = { x: 1.5, y: 1.5, size: 0.4 };

            ];

            game3.enemies = [
                { x: 7, y: 3, vx: 1, vy: 0, speed: 0.025, pattern: 'horizontal' },
                { x: 5, y: 7, vx: 0, vy: 1, speed: 0.03, pattern: 'vertical' },
                { x: 12, y: 5, vx: 1, vy: 1, speed: 0.02, pattern: 'diagonal' }
            ];

            // Calculate maze offset to center it
            const mazeW = game3.maze[0].length * game3.cellSize;
            const mazeH = game3.maze.length * game3.cellSize;
            game3.offsetX = (CANVAS_WIDTH - mazeW) / 2;

            const timer = setInterval(() => {
                if (currentScene !== 'game3' || game3.gameOver || game3.gameWon) {

                    return;
                }
                game3.timeLeft--;
                if (game3.timeLeft <= 0) {
                    game3.gameOver = true;
                }
            }, 1000);

        function updateGame3() {
            if (game3.gameWon || game3.gameOver) return;

            const speed = 0.12;
            let newX = game3.player.x;
            let newY = game3.player.y;

            if (game3.keys['ArrowUp'] || game3.keys['w']) newY -= speed;
            if (game3.keys['ArrowDown'] || game3.keys['s']) newY += speed;
            if (game3.keys['ArrowLeft'] || game3.keys['a']) newX -= speed;
            if (game3.keys['ArrowRight'] || game3.keys['d']) newX += speed;

            // Collision with walls
            const gridX = Math.floor(newX);
            const gridY = Math.floor(newY);

            if (game3.maze[gridY] && game3.maze[gridY][gridX] !== 1) {
                game3.player.x = newX;
                game3.player.y = newY;

                // Check win
                if (game3.maze[gridY][gridX] === 2) {
                    game3.gameWon = true;
                }
            }

            // Update enemies
            game3.enemies.forEach(enemy => {
                enemy.x += enemy.vx * enemy.speed;
                enemy.y += enemy.vy * enemy.speed;

                const ex = Math.floor(enemy.x + enemy.vx * 0.5);
                const ey = Math.floor(enemy.y + enemy.vy * 0.5);

                if (game3.maze[ey] && game3.maze[ey][ex] === 1) {
                    enemy.vx *= -1;
                    enemy.vy *= -1;
                }

                // Check collision with player
                if (dist(enemy.x, enemy.y, game3.player.x, game3.player.y) < 0.6) {
                    game3.player.x = 1.5;
                    game3.player.y = 1.5;
                    game3.resets++;
                }
            });
        }

            // Stats
            ctx.font = 'bold 18px "Segoe UI"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`Time: ${game3.timeLeft}s | Resets: ${game3.resets}`, CANVAS_WIDTH / 2, 80);

            // Draw maze
            for (let y = 0; y < game3.maze.length; y++) {
                for (let x = 0; x < game3.maze[y].length; x++) {
                    const px = game3.offsetX + x * game3.cellSize;
                    const py = game3.offsetY + y * game3.cellSize;

                    if (game3.maze[y][x] === 1) {
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(px, py, game3.cellSize, game3.cellSize);
                    } else if (game3.maze[y][x] === 2) {
                        ctx.fillStyle = '#10b981';
                        ctx.fillRect(px, py, game3.cellSize, game3.cellSize);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 24px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🏁', px + game3.cellSize / 2, py + game3.cellSize / 2);
                    } else {
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(px, py, game3.cellSize, game3.cellSize);
                    }

                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(px, py, game3.cellSize, game3.cellSize);
                }
            }

            // Draw enemies
            game3.enemies.forEach(enemy => {
                const ex = game3.offsetX + enemy.x * game3.cellSize;
                const ey = game3.offsetY + enemy.y * game3.cellSize;

                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(ex, ey, game3.cellSize * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Draw player
            const px = game3.offsetX + game3.player.x * game3.cellSize;
            const py = game3.offsetY + game3.player.y * game3.cellSize;

            ctx.fillStyle = '#3b82f6';
            ctx.shadowColor = '#3b82f6';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(px, py, game3.cellSize * game3.player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Win/Lose screen
            if (game3.gameWon || game3.gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (game3.gameWon) {
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 56px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('Victory!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 40);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 28px "Segoe UI"';
                    const elapsed = Math.floor((Date.now() - game3.startTime) / 1000);
                    ctx.fillText(`Time: ${elapsed}s | Resets: ${game3.resets}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);
                } else {
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 56px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('Time\'s Up!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
                }
            }

            drawBackButton();
        }

        // ==================== GAME 4: MEMORY MATCH ====================

        const game4 = {
            cards: [],
            flipped: [],
            matched: 0,
            moves: 0,
            stars: 3,
            timeLeft: 90,
            gameWon: false,
            gameOver: false,
            canFlip: true,
            gridX: 0,
            gridY: 0
        };

        function initGame4() {
            game4.cards = [];
            game4.flipped = [];
            game4.matched = 0;
            game4.moves = 0;
            game4.stars = 3;
            game4.timeLeft = 90;
            game4.gameWon = false;
            game4.gameOver = false;
            game4.canFlip = true;

            // 16 cards (8 pairs) - 4x4 grid
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#f97316', '#06b6d4'];
            const pairs = [...colors, ...colors];

            // Shuffle
            for (let i = pairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
            }

            const cardSize = 90;
            const gap = 15;
            const gridW = 4 * cardSize + 3 * gap;
            const gridH = 4 * cardSize + 3 * gap;

            game4.gridX = (CANVAS_WIDTH - gridW) / 2;
            game4.gridY = (CANVAS_HEIGHT - gridH) / 2 + 30;

            for (let i = 0; i < 16; i++) {
                const row = Math.floor(i / 4);
                const col = i % 4;

                game4.cards.push({
                    x: game4.gridX + col * (cardSize + gap),
                    y: game4.gridY + row * (cardSize + gap),
                    width: cardSize,
                    height: cardSize,
                    color: pairs[i],
                    state: 'hidden',
                    scale: 1
                });
            }

            const timer = setInterval(() => {
                if (currentScene !== 'game4' || game4.gameOver || game4.gameWon) {
                    clearInterval(timer);
                    return;
                }
                game4.timeLeft--;
                if (game4.timeLeft <= 0) {
                    game4.gameOver = true;
                }
            }, 1000);
        }

        function updateGame4() {
            // Update card scales
            game4.cards.forEach(card => {
                if (card.scale > 1) card.scale -= 0.05;
            });

            // Check flipped pair
            if (game4.flipped.length === 2 && game4.canFlip) {
                game4.canFlip = false;

                setTimeout(() => {
                    const [idx1, idx2] = game4.flipped;
                    if (game4.cards[idx1].color === game4.cards[idx2].color) {
                        game4.cards[idx1].state = 'matched';
                        game4.cards[idx2].state = 'matched';
                        game4.cards[idx1].scale = 1.15;
                        game4.cards[idx2].scale = 1.15;
                        game4.matched++;

                        if (game4.matched === 8) {
                            game4.gameWon = true;

                            // Calculate stars
                            if (game4.moves <= 16) game4.stars = 3;
                            else if (game4.moves <= 24) game4.stars = 2;
                            else game4.stars = 1;
                        }
                    } else {
                        game4.cards[idx1].state = 'hidden';
                        game4.cards[idx2].state = 'hidden';
                    }

                    game4.flipped = [];
                    game4.canFlip = true;
                }, 700);
            }
        }

        function drawGame4() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Title
            ctx.fillStyle = '#a855f7';
            ctx.font = 'bold 36px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText('🧠 Memory Match Master', CANVAS_WIDTH / 2, 60);

            // Stats
            ctx.font = 'bold 20px "Segoe UI"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`Moves: ${game4.moves} | Matched: ${game4.matched}/8 | Time: ${game4.timeLeft}s`, CANVAS_WIDTH / 2, 110);

            // Draw cards
            game4.cards.forEach((card, i) => {
                const cx = card.x + card.width / 2;
                const cy = card.y + card.height / 2;
                const w = card.width * card.scale;
                const h = card.height * card.scale;
                const x = cx - w / 2;
                const y = cy - h / 2;

                if (card.state === 'hidden') {
                    ctx.fillStyle = '#475569';
                    roundRect(x, y, w, h, 10);
                    ctx.fill();

                    ctx.fillStyle = '#64748b';
                    ctx.font = 'bold 40px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', cx, cy);
                } else {
                    ctx.fillStyle = card.color;
                    roundRect(x, y, w, h, 10);
                    ctx.fill();

                    if (card.state === 'matched') {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 48px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('✓', cx, cy);
                    }
                }

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                roundRect(x, y, w, h, 10);
                ctx.stroke();
            });

            // Win/Lose screen
            if (game4.gameWon || game4.gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (game4.gameWon) {
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 56px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('Perfect Memory!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 60);

                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'bold 48px Arial';
                    ctx.fillText('⭐'.repeat(game4.stars), CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 28px "Segoe UI"';
                    ctx.fillText(`Completed in ${game4.moves} moves`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 60);
                } else {
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 56px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('Time\'s Up!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
                }
            }

            drawBackButton();
        }

        // ==================== GAME 5: SPACE DODGE ====================

        const game5 = {
            ship: {
                x: CANVAS_WIDTH / 2,
                y: CANVAS_HEIGHT - 100,
                width: 50,
                height: 50,
                speed: 8,
                tilt: 0
            },
            meteors: [],
            score: 0,
            survivalTime: 0,
            gameOver: false,
            spawnRate: 700,
            minSpawnRate: 300,
            meteorSpeed: 4,
            spawnInterval: null,
            keys: {},
            startTime: 0
        };

        function initGame5() {
            game5.ship.x = CANVAS_WIDTH / 2;
            game5.ship.y = CANVAS_HEIGHT - 100;
            game5.ship.tilt = 0;
            game5.meteors = [];
            game5.score = 0;
            game5.survivalTime = 0;
            game5.gameOver = false;
            game5.spawnRate = 700;
            game5.meteorSpeed = 4;
            game5.keys = {};
            game5.startTime = Date.now();

            game5.spawnInterval = setInterval(() => {
                if (currentScene !== 'game5' || game5.gameOver) {
                    clearInterval(game5.spawnInterval);
                    return;
                }

                const size = Math.random() * 25 + 20;
                game5.meteors.push({
                    x: Math.random() * (CANVAS_WIDTH - 100) + 50,
                    y: -50,
                    radius: size,
                    speed: game5.meteorSpeed + Math.random() * 2,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.1
                });

                // Progressive difficulty
                if (game5.spawnRate > game5.minSpawnRate) {
                    game5.spawnRate -= 10;
                    clearInterval(game5.spawnInterval);
                    game5.spawnInterval = setInterval(() => {
                        if (currentScene === 'game5' && !game5.gameOver) {
                            const size = Math.random() * 25 + 20;
                            game5.meteors.push({
                                x: Math.random() * (CANVAS_WIDTH - 100) + 50,
                                y: -50,
                                radius: size,
                                speed: game5.meteorSpeed + Math.random() * 2,
                                rotation: Math.random() * Math.PI * 2,
                                rotSpeed: (Math.random() - 0.5) * 0.1
                            });
                        }
                    }, game5.spawnRate);
                }

                // Increase speed over time
                if (Math.floor(Date.now() / 1000) % 10 === 0 && game5.meteorSpeed < 8) {
                    game5.meteorSpeed += 0.2;
                }
            }, game5.spawnRate);

            const timer = setInterval(() => {
                if (currentScene !== 'game5' || game5.gameOver) {
                    clearInterval(timer);
                    return;
                }
                game5.survivalTime++;
            }, 1000);
        }

        function updateGame5() {
            if (game5.gameOver) return;

            // Ship movement
            if (game5.keys['ArrowLeft'] || game5.keys['a']) {
                game5.ship.x -= game5.ship.speed;
                game5.ship.tilt = -0.2;
            } else if (game5.keys['ArrowRight'] || game5.keys['d']) {
                game5.ship.x += game5.ship.speed;
                game5.ship.tilt = 0.2;
            } else {
                game5.ship.tilt = 0;
            }

            game5.ship.x = Math.max(game5.ship.width / 2, Math.min(CANVAS_WIDTH - game5.ship.width / 2, game5.ship.x));

            // Update meteors
            for (let i = game5.meteors.length - 1; i >= 0; i--) {
                const m = game5.meteors[i];
                m.y += m.speed;
                m.rotation += m.rotSpeed;

                // Collision detection
                if (dist(m.x, m.y, game5.ship.x, game5.ship.y) < m.radius + game5.ship.width / 2) {
                    game5.gameOver = true;
                }

                // Remove off-screen meteors and score
                if (m.y > CANVAS_HEIGHT + 50) {
                    game5.meteors.splice(i, 1);
                    game5.score++;
                }
            }
        }

        function drawGame5() {
            // Space background
            ctx.fillStyle = '#0c0a1f';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Animated stars
            for (let i = 0; i < 40; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.random() * 0.4})`;
                const x = (i * 87) % CANVAS_WIDTH;
                const y = (i * 143 + Date.now() * 0.08) % CANVAS_HEIGHT;
                ctx.fillRect(x, y, 2, 2);
            }

            // Title
            ctx.fillStyle = '#3b82f6';
            ctx.font = 'bold 36px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText('🚀 Space Dodge Extreme', CANVAS_WIDTH / 2, 60);

            // Stats
            ctx.font = 'bold 20px "Segoe UI"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`Score: ${game5.score} | Survival: ${game5.survivalTime}s | Speed: ${game5.meteorSpeed.toFixed(1)}`, CANVAS_WIDTH / 2, 110);

            // Draw meteors
            game5.meteors.forEach(m => {
                ctx.save();
                ctx.translate(m.x, m.y);
                ctx.rotate(m.rotation);

                // Trail
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.3)';
                ctx.lineWidth = m.radius;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, -m.speed * 4);
                ctx.lineTo(0, 0);
                ctx.stroke();

                // Meteor
                ctx.fillStyle = '#78350f';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, m.radius, 0, Math.PI * 2);
                ctx.fill();

                // Craters
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#451a03';
                ctx.beginPath();
                ctx.arc(-m.radius * 0.3, -m.radius * 0.2, m.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            // Draw ship
            ctx.save();
            ctx.translate(game5.ship.x, game5.ship.y);
            ctx.rotate(game5.ship.tilt);

            // Ship body
            ctx.fillStyle = '#3b82f6';
            ctx.shadowColor = '#3b82f6';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(-20, 25);
            ctx.lineTo(20, 25);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#60a5fa';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            // Engines
            if (game5.keys['ArrowLeft'] || game5.keys['ArrowRight'] || Math.random() > 0.7) {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.moveTo(-12, 25);
                ctx.lineTo(-8, 35 + Math.random() * 8);
                ctx.lineTo(-4, 25);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(12, 25);
                ctx.lineTo(8, 35 + Math.random() * 8);
                ctx.lineTo(4, 25);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            // Game over
            if (game5.gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 56px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 60);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px "Segoe UI"';
                ctx.fillText(`Score: ${game5.score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
                ctx.fillText(`Survived: ${game5.survivalTime}s`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 50);
            }

            drawBackButton();
        }

        // ==================== BACK BUTTON ====================

        function drawBackButton() {
            const btnX = 30;
            const btnY = 30;
            const btnW = 140;
            const btnH = 40;

            ctx.fillStyle = 'rgba(71, 85, 105, 0.9)';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            roundRect(btnX, btnY, btnW, btnH, 20);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('← Back to Hub', btnX + btnW / 2, btnY + btnH / 2);
        }

        function isBackButtonClicked(x, y) {
            return pointInRect(x, y, 30, 30, 140, 40);
        }

        // ==================== MAIN GAME LOOP ====================

        function gameLoop() {
            switch (currentScene) {
                case 'hub':
                    updateHub();
                    drawHub();
                    break;
                case 'game1':
                    updateGame1();
                    drawGame1();
                    break;
                case 'game2':
                    updateGame2();
                    drawGame2();
                    break;
                case 'game3':
                    updateGame3();
                    drawGame3();
                    break;
                case 'game4':
                    updateGame4();
                    drawGame4();
                    break;
                case 'game5':
                    updateGame5();
                    drawGame5();
                    break;
            }

            requestAnimationFrame(gameLoop);
        }

        // ==================== EVENT HANDLERS ====================

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            pmouseX = mouseX;
            pmouseY = mouseY;
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            // Game 2: Add to slice path when dragging
            if (currentScene === 'game2' && mousePressed) {
                game2.slicePath.push({ x: mouseX, y: mouseY });
                if (game2.slicePath.length > 25) {
                    game2.slicePath.shift();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            mousePressed = true;

            if (currentScene === 'hub') {
                // Check knife drag (game 2)
                if (pointInCircle(mouseX, mouseY, hub.game2.knife.x, hub.game2.knife.y, 25)) {
                    hub.game2.knife.dragging = true;
                }

                // Check slider drag (game 3)
                const sliderX = hub.icons[2].x - 60 + hub.game3.sliderPos * 120;
                const sliderY = hub.icons[2].y - 80;
                if (pointInCircle(mouseX, mouseY, sliderX, sliderY, 15)) {
                    hub.game3.sliderDragging = true;
                }

                // Check planet drag (game 5)
                const icon5 = hub.icons[4];
                const orbitRadius = 70;
                const planetX = icon5.x + Math.cos(hub.game5.lastAngle || 0) * orbitRadius;
                const planetY = icon5.y + Math.sin(hub.game5.lastAngle || 0) * orbitRadius;
                if (pointInCircle(mouseX, mouseY, planetX, planetY, hub.icons[4].radius * 0.7)) {
                    hub.game5.dragging = true;
                    const dx = mouseX - icon5.x;
                    const dy = mouseY - icon5.y;
                    hub.game5.lastAngle = Math.atan2(dy, dx);
                }

                // Check input field (game 4)
                const icon4 = hub.icons[3];
                const inputX = icon4.x - 70;
                const inputY = icon4.y + icon4.radius + 15;
                if (!hub.game4.unlocked && pointInRect(mouseX, mouseY, inputX, inputY, 140, 30)) {
                    hub.game4.inputActive = true;
                }
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            mousePressed = false;

            if (currentScene === 'hub') {
                // Release knife
                if (hub.game2.knife.dragging) {
                    const icon2 = hub.icons[1];
                    if (pointInCircle(hub.game2.knife.x, hub.game2.knife.y, icon2.x, icon2.y, icon2.radius + 20)) {
                        hub.game2.sliced = true;
                        hub.statusText = 'Fruit Slice unlocked!';
                    }
                    hub.game2.knife.x = hub.game2.knife.homeX;
                    hub.game2.knife.y = hub.game2.knife.homeY;
                    hub.game2.knife.dragging = false;
                }

                hub.game3.sliderDragging = false;
                hub.game5.dragging = false;
            }
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Back button
            if (currentScene !== 'hub' && isBackButtonClicked(clickX, clickY)) {
                currentScene = 'hub';
                canvas.style.cursor = 'default';
                return;
            }

            if (currentScene === 'hub') {
                // Check each game icon
                hub.icons.forEach((icon, idx) => {
                    if (pointInCircle(clickX, clickY, icon.x, icon.y, icon.radius)) {
                        const gameNum = idx + 1;
                        const gameState = [hub.game1, hub.game2, hub.game3, hub.game4, hub.game5][idx];

                        if (gameState.unlocked) {
                            currentScene = `game${gameNum}`;
                            if (gameNum === 1) initGame1();
                            else if (gameNum === 2) initGame2();
                            else if (gameNum === 3) initGame3();
                            else if (gameNum === 4) initGame4();
                            else if (gameNum === 5) initGame5();
                        }
                    }
                });

                // Game 4: Check unlock button
                if (!hub.game4.unlocked) {
                    const icon4 = hub.icons[3];
                    const btnX = icon4.x - 70;
                    const btnY = icon4.y + icon4.radius + 45;
                    if (pointInRect(clickX, clickY, btnX, btnY, 140, 28)) {
                        if (hub.game4.inputText === 'MEMORY') {
                            hub.game4.unlocked = true;
                            hub.statusText = 'Memory Match unlocked!';
                        } else {
                            hub.game4.shake = 10;
                            hub.statusText = 'Incorrect! Try typing: MEMORY';
                        }
                    }
                }
            } else if (currentScene === 'game1') {
                // Click buttons
                game1.buttons.forEach((btn, i) => {
                    if (pointInCircle(clickX, clickY, btn.x, btn.y, btn.radius)) {
                        if (i === game1.activeButton && btn.active) {
                            game1.score++;
                            btn.active = false;
                            btn.scale = 1.3;
                            game1.activeButton = -1;
                            game1.nextSpawnTime = Date.now() + (Math.random() * 400 + 400);

                            // Increase difficulty
                            if (game1.reactionTime > game1.minReactionTime) {
                                game1.reactionTime = Math.max(game1.minReactionTime, game1.reactionTime - 20);
                            }
                        }
                    }
                });
            } else if (currentScene === 'game4') {
                // Flip cards
                if (!game4.gameWon && game4.canFlip && game4.flipped.length < 2) {
                    game4.cards.forEach((card, i) => {
                        if (card.state === 'hidden' && pointInRect(clickX, clickY, card.x, card.y, card.width, card.height)) {
                            card.state = 'shown';
                            game4.flipped.push(i);
                            if (game4.flipped.length === 2) {
                                game4.moves++;
                            }
                        }
                    });
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (currentScene === 'hub' && hub.game4.inputActive) {
                if (e.key === 'Backspace') {
                    hub.game4.inputText = hub.game4.inputText.slice(0, -1);
                } else if (e.key === 'Enter') {
                    if (hub.game4.inputText === 'MEMORY') {
                        hub.game4.unlocked = true;
                        hub.statusText = 'Memory Match unlocked!';
                    } else {
                        hub.game4.shake = 10;
                        hub.statusText = 'Incorrect! Try typing: MEMORY';
                    }
                } else if (e.key.length === 1 && hub.game4.inputText.length < 10) {
                    hub.game4.inputText += e.key.toUpperCase();
                }
                e.preventDefault();
            }

            if (currentScene === 'game3') {
                game3.keys[e.key] = true;
                e.preventDefault();
            }

            if (currentScene === 'game5') {
                game5.keys[e.key] = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (currentScene === 'game3') {
                game3.keys[e.key] = false;
            }
            if (currentScene === 'game5') {
                game5.keys[e.key] = false;
            }
        });

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
